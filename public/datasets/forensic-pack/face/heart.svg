<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="graphite-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="shadow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="iris-grad" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    
  </defs>

  <!-- Clean Evidence Card Background -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />
  
  <!-- Feature Artwork -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Heart-shaped Face: broad forehead with widow's peak, tapering to delicate chin -->
    <path d="M50 21 C44 15 32 15 24 24 C21 42 29 64 50 86 C71 64 79 42 76 24 C68 15 56 15 50 21 Z" fill="#F1F5F9" stroke="#1E293B" stroke-width="2.2" />
    <!-- Delicate chin point -->
    <path d="M45 78 C48 81 52 81 55 78" stroke="#1E293B" stroke-width="1.6" fill="none" />
    <!-- Forehead width guides -->
    <path d="M30 26 C38 22 46 23 50 25 C54 23 62 22 70 26" stroke="#64748B" stroke-width="1.2" fill="none" />
    <!-- Inward tapering shading -->
    <path d="M28 42 C32 55 40 68 47 75" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="1.5 2" fill="none" />
    <path d="M72 42 C68 55 60 68 53 75" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="1.5 2" fill="none" />
  
  </g>
</svg>