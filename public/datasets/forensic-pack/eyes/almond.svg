<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="graphite-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="shadow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="iris-grad" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    
  </defs>

  <!-- Clean Evidence Card Background -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />
  
  <!-- Feature Artwork -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Almond Eyes: tapered canthi, elegant palpebral fissure -->
    <!-- Crease -->
    <path d="M20 40 C35 30 65 30 80 40" stroke="#64748B" stroke-width="1.4" fill="none" />
    <!-- Sclera fill -->
    <path d="M15 50 C26 36 74 36 85 50 C74 64 26 64 15 50 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
    <!-- Iris & Pupil -->
    <circle cx="50" cy="50" r="13" fill="url(#iris-grad)" stroke="#1E293B" stroke-width="1.4" />
    <circle cx="50" cy="50" r="5.5" fill="#0F172A" />
    <!-- Specular highlight -->
    <circle cx="47" cy="47" r="2.2" fill="#FFFFFF" />
    <!-- Upper lash liner emphasis -->
    <path d="M15 50 C26 36 74 36 85 50" stroke="#0F172A" stroke-width="2.8" fill="none" />
    <!-- Tear duct caruncle -->
    <path d="M15 50 C17 52 19 50 18 48" stroke="#64748B" stroke-width="1.2" fill="none" />
    <!-- Lower lid line -->
    <path d="M22 62 C38 67 62 67 78 62" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="2 2" fill="none" />
  
  </g>
</svg>