<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="graphite-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="shadow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="iris-grad" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    
  </defs>

  <!-- Clean Evidence Card Background -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />
  
  <!-- Feature Artwork -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Mole: circumscribed raised pigmented nevus with soft cast shadow -->
    <!-- Cheek area reference lines -->
    <path d="M26 36 C38 48 58 54 74 52" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="2 2" fill="none" />
    <!-- Mole drop shadow -->
    <circle cx="51" cy="51" r="7.5" fill="#CBD5E1" opacity="0.6" />
    <!-- Raised pigmented nevus body -->
    <circle cx="50" cy="50" r="7" fill="#1E293B" stroke="#0F172A" stroke-width="1.5" />
    <!-- Specular rim highlight -->
    <path d="M45 46 C47 44 51 44 53 45" stroke="#94A3B8" stroke-width="1.2" fill="none" />
  
  </g>
</svg>