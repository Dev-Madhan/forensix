<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="pencil-shade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="brow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="85%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="iris-grad" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    
  </defs>

  <!-- Clean Evidence Card (NO graph lines, NO crosshairs) -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />

  <!-- Pure Feature Artwork -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Small Eye: Compact palpebral aperture -->
    <path d="M28 44 C38 39 62 39 72 44" stroke="#64748B" stroke-width="1.2" fill="none" />
    <path d="M25 50 C33 43 67 43 75 50 C67 57 33 57 25 50 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.8" />
    <circle cx="50" cy="50" r="8" fill="url(#iris-grad)" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="50" cy="50" r="3.5" fill="#0F172A" />
    <circle cx="48" cy="48" r="1.4" fill="#FFFFFF" />
    <path d="M25 50 C33 43 67 43 75 50" stroke="#0F172A" stroke-width="2.2" fill="none" />
  
  </g>
</svg>