<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="graphite-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="shadow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="iris-grad" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    
  </defs>

  <!-- Clean Evidence Card Background -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />
  
  <!-- Feature Artwork -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Square Jawline: horizontal bottom plane, 90 deg corners -->
    <path d="M18 28 L18 60 L32 76 L68 76 L82 60 L82 28" fill="none" stroke="#1E293B" stroke-width="2.4" />
    <line x1="32" y1="76" x2="68" y2="76" stroke="#1E293B" stroke-width="2.4" />
    <!-- Gonial angle shading -->
    <path d="M18 60 L28 66 L38 72" fill="none" stroke="#64748B" stroke-width="1.4" />
    <path d="M82 60 L72 66 L62 72" fill="none" stroke="#64748B" stroke-width="1.4" />
    <line x1="34" y1="72" x2="66" y2="72" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="2 2" />
  
  </g>
</svg>