<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="graphite-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="shadow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="iris-grad" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    
  </defs>

  <!-- Clean Evidence Card Background -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />
  
  <!-- Feature Artwork -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Receding Chin: posteriorly displaced chin plane with vertical reference line -->
    <path d="M26 36 C30 52 38 68 45 74 C49 76 53 76 56 74 C62 68 68 52 72 36" fill="none" stroke="#1E293B" stroke-width="2.2" />
    <!-- Labiomental deep fold -->
    <path d="M36 44 C42 47 56 47 62 44" stroke="#475569" stroke-width="1.8" fill="none" />
    <!-- Posterior sloping shadow -->
    <path d="M38 52 C44 58 54 58 60 52" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="2 2" fill="none" />
    <!-- Forensic vertical plane showing recession -->
    <line x1="50" y1="36" x2="50" y2="78" stroke="#CBD5E1" stroke-width="1.0" stroke-dasharray="2 3" />
    <path d="M47 70 C49 72 51 72 53 70" stroke="#64748B" stroke-width="1.4" fill="none" />
  
  </g>
</svg>