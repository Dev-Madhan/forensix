<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="graphite-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="shadow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="iris-grad" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    
  </defs>

  <!-- Clean Evidence Card Background -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />
  
  <!-- Feature Artwork -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Low Hairline: hairline resting closely to eyebrows, compact forehead -->
    <path d="M26 40 C26 22 36 14 50 14 C64 14 74 22 74 40 L74 66 C74 78 64 84 50 84 C36 84 26 78 26 66 Z" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="2 3" />
    <!-- Low hairline -->
    <path d="M27 48 C38 46 44 42 50 42 C56 42 62 46 73 48" stroke="#1E293B" stroke-width="2.4" fill="none" />
    <!-- Hair volume dense above -->
    <path d="M27 48 C25 20 35 12 50 12 C65 12 75 20 73 48 Z" fill="#CBD5E1" opacity="0.6" stroke="#0F172A" stroke-width="1.8" />
    <!-- Brow ridge right beneath -->
    <line x1="32" y1="58" x2="68" y2="58" stroke="#64748B" stroke-width="1.2" />
  
  </g>
</svg>