<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="graphite-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Clean Evidence Card Background -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />

  <!-- Feature Artwork: Wide / Heavy Neck -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    <!-- Chin base reference -->
    <path d="M38 32 C44 36 56 36 62 32" stroke="#CBD5E1" stroke-width="1.4" fill="none" />
    
    <!-- Expansive wide cervical span -->
    <path d="M26 32 C26 44 24 58 18 68 C14 74 10 77 6 78" fill="none" stroke="#1E293B" stroke-width="2.5" />
    <path d="M74 32 C74 44 76 58 82 68 C86 74 90 77 94 78" fill="none" stroke="#1E293B" stroke-width="2.5" />

    <!-- Lateral heavy shading -->
    <path d="M28 42 C28 54 26 66 22 72" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="1.5 2" fill="none" />
    <path d="M72 42 C72 54 74 66 78 72" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="1.5 2" fill="none" />
  </g>
</svg>
