<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="pencil-shade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="brow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="85%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="iris-grad" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    
  </defs>

  <!-- Clean Evidence Card (NO graph lines, NO crosshairs) -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />

  <!-- Pure Feature Artwork -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Slightly downturned: outer canthus angled downward -->
    <!-- Left eye tilted down -->
    <path d="M12 55 C19 47 33 44 39 48 C33 56 19 61 12 55 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.8" />
    <circle cx="26" cy="51" r="5.2" fill="url(#iris-grad)" />
    <circle cx="26" cy="51" r="2.2" fill="#0F172A" />
    <path d="M12 55 C19 47 33 44 39 48" stroke="#0F172A" stroke-width="2.4" fill="none" />
    <!-- Right eye tilted down -->
    <path d="M61 48 C67 44 81 47 88 55 C81 61 67 56 61 48 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.8" />
    <circle cx="74" cy="51" r="5.2" fill="url(#iris-grad)" />
    <circle cx="74" cy="51" r="2.2" fill="#0F172A" />
    <path d="M61 48 C67 44 81 47 88 55" stroke="#0F172A" stroke-width="2.4" fill="none" />
  
  </g>
</svg>