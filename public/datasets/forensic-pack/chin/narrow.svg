  <!-- Feature Artwork -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Narrow Chin: compressed petite chin, steep inward angles -->
    <path d="M32 38 C35 55 42 74 46 78 L54 78 C58 74 65 55 68 38" fill="none" stroke="#1E293B" stroke-width="2.2" />
    <line x1="46" y1="78" x2="54" y2="78" stroke="#1E293B" stroke-width="2.2" />
    <path d="M40 48 C45 50 55 50 60 48" stroke="#64748B" stroke-width="1.4" fill="none" />
    <ellipse cx="50" cy="66" rx="6" ry="7" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.0" stroke-dasharray="1.5 2" />
  
  </g>
