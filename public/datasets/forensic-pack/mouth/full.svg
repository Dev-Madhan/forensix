<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="pencil-shade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="upper-lip-shade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="lower-lip-shade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="nose-tip-glow" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#F1F5F9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.7"/>
    </radialGradient>
    
  </defs>

  <!-- Clean Evidence Card Background -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />
  
  <!-- Feature Artwork -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Full Lips: Plump voluptuous vermilion, deep Cupid's bow, pillowy cushions -->
    <!-- Prominent Philtrum columns -->
    <path d="M43 24 C44 30 46 34 46 37" stroke="#64748B" stroke-width="1.4" fill="none" />
    <path d="M57 24 C56 30 54 34 54 37" stroke="#64748B" stroke-width="1.4" fill="none" />

    <!-- Upper Lip: Full voluptuous contours -->
    <path d="M13 50 C24 40 41 33 47 31 C49 34 51 34 53 31 C59 33 76 40 87 50 C74 52 58 55 50 55 C42 55 26 52 13 50 Z" fill="url(#upper-lip-shade)" stroke="#1E293B" stroke-width="2.0" />

    <!-- Cupid's bow peak highlight & notch -->
    <path d="M47 31 C49 34 51 34 53 31" stroke="#0F172A" stroke-width="2.2" fill="none" />

    <!-- Oral Fissure: Deep wave contour with central tubercle projection -->
    <path d="M12 50 C24 48 42 55 50 55 C58 55 76 48 88 50" stroke="#0F172A" stroke-width="2.8" fill="none" />
    <circle cx="12" cy="50" r="2.0" fill="#0F172A" />
    <circle cx="88" cy="50" r="2.0" fill="#0F172A" />

    <!-- Lower Lip: Deep pillowy double-cushion -->
    <path d="M15 50 C22 71 78 71 85 50 C76 54 58 55 50 55 C42 55 24 54 15 50 Z" fill="url(#lower-lip-shade)" stroke="#1E293B" stroke-width="2.0" />

    <!-- Twin pillowy highlights -->
    <ellipse cx="40" cy="59" rx="8" ry="3.5" fill="#FFFFFF" opacity="0.8" />
    <ellipse cx="60" cy="59" rx="8" ry="3.5" fill="#FFFFFF" opacity="0.8" />
    <line x1="50" y1="56" x2="50" y2="66" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="1.5 2" />

    <!-- Deep Labiomental shadow -->
    <path d="M30 75 C40 79 60 79 70 75" stroke="#475569" stroke-width="2.0" fill="none" />
  
  </g>
</svg>