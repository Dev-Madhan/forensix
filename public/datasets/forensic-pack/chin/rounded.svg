<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="graphite-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="shadow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="iris-grad" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    
  </defs>

  <!-- Clean Evidence Card Background -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />
  
  <!-- Feature Artwork -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Rounded Chin: soft convex mental curve with upper crease -->
    <path d="M30 40 C33 60 38 76 50 78 C62 76 67 60 70 40" fill="none" stroke="#1E293B" stroke-width="2.2" />
    <!-- Mentalis muscle curve & labiomental crease -->
    <path d="M38 46 C44 49 56 49 62 46" stroke="#64748B" stroke-width="1.6" fill="none" />
    <!-- Central rounded highlight & graphite stipple -->
    <ellipse cx="50" cy="62" rx="10" ry="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="2 2" />
    <path d="M44 72 C47 74 53 74 56 72" stroke="#1E293B" stroke-width="1.8" fill="none" />
  
  </g>
</svg>