<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Clean Evidence Card Background -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />
  <!-- Feature Artwork -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Rounded Nose: Soft spherical bulbous tip lobule, smooth curved alar wings -->
    <path d="M43 16 C45 22 46 28 45 36" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="2 2" fill="none" />
    <path d="M57 16 C55 22 54 28 55 36" stroke="#475569" stroke-width="1.4" fill="none" />

    <line x1="45" y1="36" x2="44" y2="53" stroke="#CBD5E1" stroke-width="1.2" />
    <line x1="55" y1="36" x2="56" y2="53" stroke="#1E293B" stroke-width="1.6" />
    <polygon points="45,36 55,36 56,53 44,53" fill="#E2E8F0" opacity="0.5" />

    <!-- Distinct rounded tip apex (spherical contour without full circle enclosure) -->
    <path d="M42 58 C42 54 45 52 50 52 C55 52 58 54 58 58" stroke="#64748B" stroke-width="1.3" fill="none" />
    <path d="M41 62 C43 66.5 57 66.5 59 62" stroke="#1E293B" stroke-width="1.8" fill="none" />
    <!-- Soft circular tip highlight -->
    <ellipse cx="48" cy="58" rx="3.0" ry="2.2" fill="#FFFFFF" opacity="0.85" />

    <!-- Rounded, fleshy alar wings -->
    <path d="M31 61 C27 64 27 70 33 72" stroke="#1E293B" stroke-width="2.0" fill="none" />
    <path d="M30 62 C29 65 30 69 33 72" stroke="#94A3B8" stroke-width="1.0" fill="none" />

    <path d="M69 61 C73 64 73 70 67 72" stroke="#1E293B" stroke-width="2.0" fill="none" />
    <path d="M70 62 C71 65 70 69 67 72" stroke="#475569" stroke-width="1.2" fill="none" />

    <!-- Nostril apertures -->
    <path d="M35 70 C36 67.5 40 67.5 43 69.5 C41 71 37 71 35 70 Z" fill="#0F172A" />
    <path d="M65 70 C64 67.5 60 67.5 57 69.5 C59 71 63 71 65 70 Z" fill="#0F172A" />

    <!-- Columella -->
    <path d="M46 69 C48 72 52 72 54 69" stroke="#1E293B" stroke-width="2.0" fill="none" />
    <path d="M47 72 C49 74 51 74 53 72" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="1.5 1.5" fill="none" />

    <line x1="46" y1="74" x2="45" y2="83" stroke="#CBD5E1" stroke-width="1.0" stroke-dasharray="1.5 2" />
    <line x1="54" y1="74" x2="55" y2="83" stroke="#CBD5E1" stroke-width="1.0" stroke-dasharray="1.5 2" />
  
  </g>
</svg>