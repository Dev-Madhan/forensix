<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Clean Evidence Card Background -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />
  <!-- Feature Artwork -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Broad Nose: Wide nasal root, wider bridge, flared alar wings, expansive tip -->
    <!-- Wide Glabella -->
    <path d="M37 16 C41 22 42 28 41 36" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="2 2" fill="none" />
    <path d="M63 16 C59 22 58 28 59 36" stroke="#475569" stroke-width="1.4" fill="none" />

    <!-- Broad bridge lines -->
    <line x1="41" y1="36" x2="40" y2="55" stroke="#CBD5E1" stroke-width="1.2" />
    <line x1="59" y1="36" x2="60" y2="55" stroke="#1E293B" stroke-width="1.6" />
    <polygon points="41,36 59,36 61,55 39,55" fill="#E2E8F0" opacity="0.55" />

    <!-- Broad tip curve -->
    <path d="M40 57 C45 55 55 55 60 57" stroke="#64748B" stroke-width="1.3" fill="none" />
    <path d="M39 62 C43 65.5 57 65.5 61 62" stroke="#1E293B" stroke-width="1.8" fill="none" />

    <!-- Flared lateral alar wings (wider span) -->
    <path d="M26 60 C21 64 22 71 29 73" stroke="#1E293B" stroke-width="2.2" fill="none" />
    <path d="M24 61 C22 65 23 70 27 73" stroke="#94A3B8" stroke-width="1.1" fill="none" />

    <path d="M74 60 C79 64 78 71 71 73" stroke="#1E293B" stroke-width="2.2" fill="none" />
    <path d="M76 61 C78 65 77 70 73 73" stroke="#475569" stroke-width="1.3" fill="none" />

    <!-- Wider horizontal nostril apertures -->
    <path d="M31 70 C33 67 39 67 42 69 C40 71 34 71 31 70 Z" fill="#0F172A" />
    <path d="M69 70 C67 67 61 67 58 69 C60 71 66 71 69 70 Z" fill="#0F172A" />

    <!-- Wide Columella -->
    <path d="M44 68.5 C47 72 53 72 56 68.5" stroke="#1E293B" stroke-width="2.0" fill="none" />
    <path d="M45 72 C48 74.5 52 74.5 55 72" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="1.5 1.5" fill="none" />

    <line x1="43" y1="75" x2="42" y2="84" stroke="#CBD5E1" stroke-width="1.0" stroke-dasharray="1.5 2" />
    <line x1="57" y1="75" x2="58" y2="84" stroke="#CBD5E1" stroke-width="1.0" stroke-dasharray="1.5 2" />
  
  </g>
</svg>