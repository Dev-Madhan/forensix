<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="pencil-shade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="upper-lip-shade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="lower-lip-shade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="nose-tip-glow" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#F1F5F9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.7"/>
    </radialGradient>
    
  </defs>

  <!-- Clean Evidence Card Background -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />
  
  <!-- Feature Artwork -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Thin Lips: Slender vermilion ribbons, compressed oral fissure -->
    <!-- Subtle Philtrum depression -->
    <path d="M45 28 C46 34 46 38 46 41" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="1.5 2" fill="none" />
    <path d="M55 28 C54 34 54 38 54 41" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="1.5 2" fill="none" />

    <!-- Upper vermilion border (thin delicate ribbon) -->
    <path d="M16 50 C28 47 43 44 47 42 C49 43 51 43 53 42 C57 44 72 47 84 50" stroke="#475569" stroke-width="1.5" fill="none" />
    <!-- Upper lip body with soft graphite tone -->
    <path d="M16 50 C28 47 43 44 47 42 C49 43 51 43 53 42 C57 44 72 47 84 50 C72 51 56 51 50 51 C44 51 28 51 16 50 Z" fill="#CBD5E1" opacity="0.45" />

    <!-- Main oral fissure line (tight, crisp, elegant) -->
    <path d="M15 50 C26 49 44 51.5 50 51.5 C56 51.5 74 49 85 50" stroke="#0F172A" stroke-width="2.6" fill="none" />
    <!-- Corner depth nodes -->
    <circle cx="15" cy="50" r="1.6" fill="#0F172A" />
    <circle cx="85" cy="50" r="1.6" fill="#0F172A" />

    <!-- Lower vermilion border (thin ribbon) -->
    <path d="M18 50 C28 57 72 57 82 50" stroke="#64748B" stroke-width="1.6" fill="none" />
    <!-- Lower lip soft highlight -->
    <path d="M18 50 C28 57 72 57 82 50 C74 51 56 51.5 50 51.5 C44 51.5 26 51 18 50 Z" fill="#F1F5F9" opacity="0.6" />

    <!-- Labiomental shadow below -->
    <path d="M38 64 C44 66 56 66 62 64" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="2 2" fill="none" />
  
  </g>
</svg>