    <line x1="78" y1="52" x2="70" y2="57" stroke="#64748B" stroke-width="1.6" />
    <path d="M26 53 L38 68 L50 71 L62 68 L74 53" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="2 2" />
  
  </g>
