<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Clean Evidence Card Background -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />
  <!-- Feature Artwork -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Upturned Nose: Concave bridge, elevated tip, visible nostril openings and columella -->
    <!-- Concave bridge curve -->
    <path d="M44 16 C46 25 46 36 44 46" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="2 2" fill="none" />
    <path d="M56 16 C54 25 54 36 56 46" stroke="#475569" stroke-width="1.4" fill="none" />

    <polygon points="44,26 56,26 56,46 44,46" fill="#E2E8F0" opacity="0.45" />

    <!-- Elevated tip lobule sitting higher up at y: 55 -->
    <path d="M43 54 C46 51.5 54 51.5 57 54" stroke="#64748B" stroke-width="1.4" fill="none" />
    <path d="M43 59 C46 61.5 54 61.5 57 59" stroke="#1E293B" stroke-width="1.8" fill="none" />
    <circle cx="48.5" cy="55.5" r="1.8" fill="#FFFFFF" opacity="0.9" />

    <!-- High arched alar wings -->
    <path d="M31 60 C28 63 29 69 34 71" stroke="#1E293B" stroke-width="2.0" fill="none" />
    <path d="M69 60 C72 63 71 69 66 71" stroke="#1E293B" stroke-width="2.0" fill="none" />

    <!-- Fully visible, clear oval nostril apertures from front tilt -->
    <ellipse cx="39" cy="65" rx="3.5" ry="2.6" fill="#0F172A" transform="rotate(-20 39 65)" />
    <ellipse cx="61" cy="65" rx="3.5" ry="2.6" fill="#0F172A" transform="rotate(20 61 65)" />

    <!-- Prominent descending columella pillar -->
    <path d="M46 61 C48 67 52 67 54 61" stroke="#1E293B" stroke-width="2.0" fill="none" />
    <!-- Under-nose shadow -->
    <path d="M46 68 C48 71 52 71 54 68" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="1.5 1.5" fill="none" />

    <line x1="46" y1="73" x2="45" y2="82" stroke="#CBD5E1" stroke-width="1.0" stroke-dasharray="1.5 2" />
    <line x1="54" y1="73" x2="55" y2="82" stroke="#CBD5E1" stroke-width="1.0" stroke-dasharray="1.5 2" />
  
  </g>
</svg>