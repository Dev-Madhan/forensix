<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="graphite-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Clean Evidence Card Background -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />

  <!-- Feature Artwork: Thick Muscular Neck -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    <!-- Chin base reference -->
    <path d="M40 32 C45 35 55 35 60 32" stroke="#CBD5E1" stroke-width="1.4" fill="none" />
    
    <!-- Broad, muscular cervical column -->
    <path d="M28 32 C28 44 26 58 20 68 C16 74 12 78 8 80" fill="none" stroke="#1E293B" stroke-width="2.4" />
    <path d="M72 32 C72 44 74 58 80 68 C84 74 88 78 92 80" fill="none" stroke="#1E293B" stroke-width="2.4" />

    <!-- Sternocleidomastoid Muscle Definition -->
    <path d="M34 38 C38 52 44 68 47 74" stroke="#64748B" stroke-width="1.5" stroke-dasharray="2 2" fill="none" />
    <path d="M66 38 C62 52 56 68 53 74" stroke="#64748B" stroke-width="1.5" stroke-dasharray="2 2" fill="none" />

    <!-- Sternal notch -->
    <path d="M45 76 C47 78 53 78 55 76" stroke="#1E293B" stroke-width="1.8" fill="none" />
  </g>
</svg>
