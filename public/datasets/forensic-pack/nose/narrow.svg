<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Clean Evidence Card Background -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />
  <!-- Feature Artwork -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Narrow Nose: Slender, pinched dorsal bridge, petite alar wings, tight nostrils -->
    <!-- Slender root -->
    <path d="M45 16 C46 21 47 27 47 35" stroke="#94A3B8" stroke-width="1.1" stroke-dasharray="2 2" fill="none" />
    <path d="M55 16 C54 21 53 27 53 35" stroke="#475569" stroke-width="1.3" fill="none" />

    <!-- Close-set bridge lines -->
    <line x1="47" y1="35" x2="47" y2="56" stroke="#CBD5E1" stroke-width="1.1" />
    <line x1="53" y1="35" x2="53" y2="56" stroke="#1E293B" stroke-width="1.5" />
    <polygon points="47,35 53,35 53,56 47,56" fill="#E2E8F0" opacity="0.45" />

    <!-- Petite tip curve -->
    <path d="M46 59 C48 57.5 52 57.5 54 59" stroke="#64748B" stroke-width="1.2" fill="none" />
    <path d="M45 62 C47 64 53 64 55 62" stroke="#1E293B" stroke-width="1.5" fill="none" />

    <!-- Petite, tight alar wings -->
    <path d="M37 62 C34 64 34 69 39 71" stroke="#1E293B" stroke-width="1.8" fill="none" />
    <path d="M63 62 C66 64 66 69 61 71" stroke="#1E293B" stroke-width="1.8" fill="none" />

    <!-- Slender vertical nostril slits -->
    <ellipse cx="42" cy="69" rx="1.8" ry="2.6" fill="#0F172A" transform="rotate(12 42 69)" />
    <ellipse cx="58" cy="69" rx="1.8" ry="2.6" fill="#0F172A" transform="rotate(-12 58 69)" />

    <!-- Delicate columella -->
    <path d="M47 68.5 C48.5 71 51.5 71 53 68.5" stroke="#1E293B" stroke-width="1.7" fill="none" />

    <line x1="47" y1="73" x2="46" y2="82" stroke="#CBD5E1" stroke-width="0.9" stroke-dasharray="1.5 2" />
    <line x1="53" y1="73" x2="54" y2="82" stroke="#CBD5E1" stroke-width="0.9" stroke-dasharray="1.5 2" />
  
  </g>
</svg>