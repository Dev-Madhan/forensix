  </defs>
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
<!-- Parted Lips with Incisors -->
    <path d="M30 45 C38 41 46 41 50 43 C54 41 62 41 70 45 C64 47 50 49 30 45 Z" fill="#E2E8F0" stroke="#1E293B" stroke-width="1.5" />
    <!-- Oral cavity dark background -->
    <path d="M33 46 C42 49 58 49 67 46 C64 56 36 56 33 46 Z" fill="#0F172A" />
    <!-- Clean white central incisors -->
    <rect x="44" y="46" width="6" height="6.5" rx="0.8" fill="#FFFFFF" stroke="#334155" stroke-width="0.8" />
    <rect x="50" y="46" width="6" height="6.5" rx="0.8" fill="#FFFFFF" stroke="#334155" stroke-width="0.8" />
    <!-- Laterals -->
    <rect x="39" y="46.5" width="5" height="5.5" rx="0.6" fill="#F1F5F9" stroke="#475569" stroke-width="0.7" />
    <rect x="56" y="46.5" width="5" height="5.5" rx="0.6" fill="#F1F5F9" stroke="#475569" stroke-width="0.7" />
    <!-- Lower lip -->
    <path d="M33 54 C42 63 58 63 67 54 C60 62 40 62 33 54 Z" fill="#E2E8F0" stroke="#1E293B" stroke-width="1.5" />
  </g>
