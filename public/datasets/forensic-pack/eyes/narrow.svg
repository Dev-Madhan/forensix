<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="graphite-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="shadow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="iris-grad" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <clipPath id="narrow-clip"><path d="M12 50 C28 41 72 41 88 50 C72 59 28 59 12 50 Z" /></clipPath>
  </defs>

  <!-- Clean Evidence Card Background -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />
  
  <!-- Feature Artwork -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Narrow Eyes: slender horizontal slit, compressed eyelids -->
    <path d="M20 44 C35 38 65 38 80 44" stroke="#64748B" stroke-width="1.2" fill="none" />
    <path d="M12 50 C28 41 72 41 88 50 C72 59 28 59 12 50 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
    <!-- Iris clipped by narrow eyelids -->
    <g clip-path="url(#narrow-clip)">
      <circle cx="50" cy="50" r="12" fill="url(#iris-grad)" stroke="#1E293B" stroke-width="1.4" />
      <circle cx="50" cy="50" r="5" fill="#0F172A" />
      <circle cx="47" cy="48" r="1.8" fill="#FFFFFF" />
    </g>
    <path d="M12 50 C28 41 72 41 88 50" stroke="#0F172A" stroke-width="2.6" fill="none" />
  
  </g>
</svg>