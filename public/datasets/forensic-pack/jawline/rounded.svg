  <!-- Feature Artwork -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Rounded Jawline: continuous circular arch -->
    <path d="M20 28 C20 54 30 78 50 80 C70 78 80 54 80 28" fill="none" stroke="#1E293B" stroke-width="2.4" />
    <path d="M26 36 C28 56 36 72 50 74 C64 72 72 56 74 36" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="2 2" />
