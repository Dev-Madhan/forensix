<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="graphite-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="shadow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="iris-grad" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    
  </defs>

  <!-- Clean Evidence Card Background -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />
  
  <!-- Feature Artwork -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Moustache: groomed upper lip facial hair with directional pencil strokes -->
    <!-- Upper lip line below -->
    <path d="M20 60 C32 58 44 60 50 60 C56 60 68 58 80 60" stroke="#CBD5E1" stroke-width="1.2" fill="none" />
    <!-- Winged moustache body -->
    <path d="M18 56 C26 48 40 44 50 48 C60 44 74 48 82 56 C74 58 60 58 50 54 C40 58 26 58 18 56 Z" fill="#1E293B" stroke="#0F172A" stroke-width="2.0" />
    <!-- Hair stroke texture -->
    <path d="M24 54 C32 52 40 50 46 51" stroke="#64748B" stroke-width="1.2" fill="none" />
    <path d="M76 54 C68 52 60 50 54 51" stroke="#64748B" stroke-width="1.2" fill="none" />
    <line x1="50" y1="48" x2="50" y2="54" stroke="#0F172A" stroke-width="1.4" />
  
  </g>
</svg>