<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="graphite-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Clean Evidence Card Background -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />

  <!-- Feature Artwork: Attached Earlobe (slopes directly into cheek line) -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Helix tapering directly into jaw without dangling notch -->
    <path d="M42 22 C56 22 65 32 65 45 C65 58 58 68 46 73 C42 75 36 76 34 76" fill="none" stroke="#1E293B" stroke-width="2.2" />
    <!-- Inner Antihelix -->
    <path d="M49 32 C55 38 55 50 49 57 C45 61 40 63 36 63" fill="none" stroke="#64748B" stroke-width="1.6" />
    <!-- Tragus -->
    <path d="M36 46 C39 46 41 49 39 53 C38 55 35 55 34 54" fill="none" stroke="#1E293B" stroke-width="1.8" />
    <!-- Facial Attachment Axis indicator line -->
    <path d="M34 68 C34 74 34 80 34 84" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="1.5 2" fill="none" />
  </g>
</svg>
