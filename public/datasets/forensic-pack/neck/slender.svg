<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="graphite-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Clean Evidence Card Background -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />

  <!-- Feature Artwork: Slender / Thin Neck -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    <!-- Chin base reference -->
    <path d="M42 32 C46 34 54 34 58 32" stroke="#CBD5E1" stroke-width="1.4" fill="none" />
    
    <!-- Graceful, narrow cervical column -->
    <path d="M38 32 C38 48 37 62 30 72 C26 78 18 82 14 84" fill="none" stroke="#1E293B" stroke-width="2.0" />
    <path d="M62 32 C62 48 63 62 70 72 C74 78 82 82 86 84" fill="none" stroke="#1E293B" stroke-width="2.0" />

    <!-- Delicate clavicles -->
    <path d="M38 78 C32 77 24 79 16 84" stroke="#94A3B8" stroke-width="1.2" fill="none" />
    <path d="M62 78 C68 77 76 79 84 84" stroke="#94A3B8" stroke-width="1.2" fill="none" />
    <circle cx="50" cy="78" r="1.5" fill="#94A3B8" />
  </g>
</svg>
