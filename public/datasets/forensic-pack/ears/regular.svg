<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="graphite-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="shadow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Clean Evidence Card Background -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />

  <!-- Feature Artwork -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Helix & Detached Lobule -->
    <path d="M42 22 C56 22 66 32 66 45 C66 60 60 72 52 76 C46 79 38 76 38 70 C38 66 41 62 44 60" fill="none" stroke="#1E293B" stroke-width="2.2" />
    <!-- Inner Antihelix & Concha -->
    <path d="M50 32 C56 38 56 50 50 58 C46 62 42 63 39 63" fill="none" stroke="#64748B" stroke-width="1.6" />
    <!-- Tragus & Intertragic Notch -->
    <path d="M38 46 C41 46 43 49 41 53 C40 55 37 56 36 54" fill="none" stroke="#1E293B" stroke-width="1.8" />
    <!-- Scapha & Fossa Shading -->
    <path d="M54 36 C58 42 58 52 54 58" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="1.5 2" fill="none" />
  </g>
</svg>
