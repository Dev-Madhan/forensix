<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="graphite-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Clean Evidence Card Background -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />

  <!-- Feature Artwork: Short / Compact Neck with high trapezius slope -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    <!-- Chin base reference -->
    <path d="M40 36 C45 40 55 40 60 36" stroke="#CBD5E1" stroke-width="1.4" fill="none" />
    
    <!-- Short cervical height with early, steep high trapezius slope -->
    <path d="M32 36 C30 46 24 56 16 66 C12 72 8 76 4 78" fill="none" stroke="#1E293B" stroke-width="2.3" />
    <path d="M68 36 C70 46 76 56 84 66 C88 72 92 76 96 78" fill="none" stroke="#1E293B" stroke-width="2.3" />

    <!-- Compact clavicle -->
    <path d="M38 72 C30 72 20 74 14 78" stroke="#94A3B8" stroke-width="1.3" fill="none" />
    <path d="M62 72 C70 72 80 74 86 78" stroke="#94A3B8" stroke-width="1.3" fill="none" />
  </g>
</svg>
