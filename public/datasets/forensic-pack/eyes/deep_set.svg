<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="graphite-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="shadow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="iris-grad" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    
  </defs>

  <!-- Clean Evidence Card Background -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />
  
  <!-- Feature Artwork -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Deep-set Eyes: heavy supraorbital brow ridge, deep socket shading -->
    <!-- Heavy brow socket shadow -->
    <path d="M14 36 C30 25 70 25 86 36 C70 42 30 42 14 36 Z" fill="#E2E8F0" opacity="0.8" />
    <path d="M15 35 C32 25 68 25 85 35" stroke="#334155" stroke-width="1.8" fill="none" />
    <path d="M18 50 C28 40 72 40 82 50 C72 60 28 60 18 50 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
    <circle cx="50" cy="50" r="11" fill="url(#iris-grad)" stroke="#1E293B" stroke-width="1.3" />
    <circle cx="50" cy="50" r="5" fill="#0F172A" />
    <circle cx="47" cy="47" r="1.8" fill="#FFFFFF" />
    <path d="M18 50 C28 40 72 40 82 50" stroke="#0F172A" stroke-width="2.8" fill="none" />
    <!-- Deep fold cross hatching -->
    <line x1="26" y1="36" x2="30" y2="42" stroke="#94A3B8" stroke-width="1.0" />
    <line x1="36" y1="34" x2="40" y2="41" stroke="#94A3B8" stroke-width="1.0" />
    <line x1="64" y1="34" x2="60" y2="41" stroke="#94A3B8" stroke-width="1.0" />
    <line x1="74" y1="36" x2="70" y2="42" stroke="#94A3B8" stroke-width="1.0" />
  
  </g>
</svg>