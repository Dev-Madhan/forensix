<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Clean Evidence Card Background -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />
  <!-- Feature Artwork -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Straight Nose: Classic straight dorsal bridge, balanced alar wings, refined tip -->
    <!-- Soft Glabella at brow level -->
    <path d="M42 16 C44 21 45 27 45 34" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="2 2" fill="none" />
    <path d="M58 16 C56 21 55 27 55 34" stroke="#475569" stroke-width="1.4" fill="none" />

    <!-- Straight dorsal ridge lines -->
    <line x1="45" y1="34" x2="45" y2="55" stroke="#CBD5E1" stroke-width="1.2" />
    <line x1="55" y1="34" x2="55" y2="55" stroke="#1E293B" stroke-width="1.6" />
    <!-- Soft lateral slope shadow -->
    <polygon points="46,34 54,34 56,55 46,55" fill="#E2E8F0" opacity="0.5" />

    <!-- Gentle supratip / tip lobule curve -->
    <path d="M44 58 C47 56 53 56 56 58" stroke="#64748B" stroke-width="1.3" fill="none" />
    <path d="M43 62 C46 64.5 54 64.5 57 62" stroke="#1E293B" stroke-width="1.6" fill="none" />

    <!-- Left Alar wing (clean natural open curve) -->
    <path d="M33 59 C30 62 30 68 36 70" stroke="#1E293B" stroke-width="2.0" fill="none" />
    <path d="M31 60 C30 63 30 67 33 70" stroke="#94A3B8" stroke-width="1.0" fill="none" />

    <!-- Right Alar wing (clean natural open curve) -->
    <path d="M67 59 C70 62 70 68 64 70" stroke="#1E293B" stroke-width="2.0" fill="none" />
    <path d="M69 60 C70 63 70 67 67 70" stroke="#475569" stroke-width="1.2" fill="none" />

    <!-- Nostril apertures (subtle dark crescent slits) -->
    <path d="M37 68.5 C38 66 42 66 44 68 C42 69.5 38 69.5 37 68.5 Z" fill="#0F172A" />
    <path d="M63 68.5 C62 66 58 66 56 68 C58 69.5 62 69.5 63 68.5 Z" fill="#0F172A" />

    <!-- Columella central curve -->
    <path d="M46 68 C48 71 52 71 54 68" stroke="#1E293B" stroke-width="2.0" fill="none" />
    <!-- Delicate shadow beneath columella -->
    <path d="M47 71 C49 73 51 73 53 71" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="1.5 1.5" fill="none" />

    <!-- Philtrum columns -->
    <line x1="46" y1="74" x2="45" y2="83" stroke="#CBD5E1" stroke-width="1.0" stroke-dasharray="1.5 2" />
    <line x1="54" y1="74" x2="55" y2="83" stroke="#CBD5E1" stroke-width="1.0" stroke-dasharray="1.5 2" />
  
  </g>
</svg>