<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="graphite-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Clean Evidence Card Background -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />

  <!-- Feature Artwork: Protruding / Flared Auricle -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wide lateral helix projection -->
    <path d="M38 20 C56 18 72 28 72 45 C72 62 64 74 54 78 C46 81 38 78 38 70 C38 65 41 62 44 60" fill="none" stroke="#1E293B" stroke-width="2.2" />
    <!-- Wide Scapha hollow -->
    <path d="M52 28 C62 36 62 52 54 62" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="1.5 2" fill="none" />
    <!-- Prominent Antihelix fold -->
    <path d="M47 30 C53 36 53 48 47 56 C43 60 39 61 36 61" fill="none" stroke="#64748B" stroke-width="1.6" />
    <!-- Tragus -->
    <path d="M35 44 C38 44 40 47 38 51 C37 53 34 54 33 52" fill="none" stroke="#1E293B" stroke-width="1.8" />
  </g>
</svg>
