<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="graphite-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Clean Evidence Card Background -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />

  <!-- Feature Artwork: Long / Elongated Neck -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    <!-- Chin base reference -->
    <path d="M42 26 C46 28 54 28 58 26" stroke="#CBD5E1" stroke-width="1.4" fill="none" />
    
    <!-- Elongated vertical cervical drop before flare -->
    <path d="M36 26 C36 44 35 64 30 76 C26 82 20 86 16 88" fill="none" stroke="#1E293B" stroke-width="2.1" />
    <path d="M64 26 C64 44 65 64 70 76 C74 82 80 86 84 88" fill="none" stroke="#1E293B" stroke-width="2.1" />

    <!-- Thyroid cartilage (Adam's apple hint) & vertical tendon -->
    <path d="M47 48 C49 50 51 50 53 48" stroke="#64748B" stroke-width="1.6" fill="none" />
    <line x1="50" y1="52" x2="50" y2="78" stroke="#94A3B8" stroke-width="1.1" stroke-dasharray="1.5 2" />
  </g>
</svg>
