<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="graphite-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="shadow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
<!-- Glabellar Frown Lines (11 Lines) -->
    <!-- Brow outline reference -->
    <path d="M28 42 C34 38 44 40 47 43" stroke="#94A3B8" stroke-width="1.4" fill="none" />
    <path d="M72 42 C66 38 56 40 53 43" stroke="#94A3B8" stroke-width="1.4" fill="none" />
    <!-- Vertical corrugator furrows -->
    <path d="M47 34 C46 42 47 49 48 54" stroke="#1E293B" stroke-width="2.3" fill="none" />
    <path d="M53 34 C54 42 53 49 52 54" stroke="#1E293B" stroke-width="2.3" fill="none" />
    <!-- Minor transverse root crease -->
    <path d="M46 51 C48 53 52 53 54 51" stroke="#64748B" stroke-width="1.3" fill="none" />
  </g>
</svg>