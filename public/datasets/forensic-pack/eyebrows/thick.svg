<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="pencil-shade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="brow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="85%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="iris-grad" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    
  </defs>

  <!-- Clean Evidence Card (NO graph lines, NO crosshairs) -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />

  <!-- Pure Feature Artwork -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Thick Eyebrow: Dense, robust vertical span, bushy feathered texture -->
    <path d="M12 55 C24 39 50 35 68 36 C78 38 84 45 88 53 C80 45 72 42 62 42 C46 42 26 48 12 55 Z" fill="#0F172A" stroke="#0F172A" stroke-width="1.4" />
    <!-- Dense layered follicle strokes -->
    <path d="M14 55 C26 46 48 43 65 43 C74 43 82 49 86 53" stroke="#334155" stroke-width="2.6" fill="none" />
    <line x1="15" y1="57" x2="20" y2="49" stroke="#1E293B" stroke-width="1.4" />
    <line x1="26" y1="53" x2="33" y2="43" stroke="#1E293B" stroke-width="1.4" />
    <line x1="42" y1="48" x2="50" y2="39" stroke="#1E293B" stroke-width="1.4" />
    <line x1="58" y1="44" x2="66" y2="39" stroke="#1E293B" stroke-width="1.4" />
    <line x1="72" y1="44" x2="79" y2="42" stroke="#1E293B" stroke-width="1.4" />
  
  </g>
</svg>