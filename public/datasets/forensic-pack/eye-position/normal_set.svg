<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="pencil-shade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="brow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="85%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="iris-grad" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    
  </defs>

  <!-- Clean Evidence Card (NO graph lines, NO crosshairs) -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />

  <!-- Pure Feature Artwork -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Normal-set: balanced eye spacing -->
    <!-- Left Eye -->
    <path d="M14 50 C20 43 34 43 40 50 C34 57 20 57 14 50 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.8" />
    <circle cx="27" cy="50" r="5.2" fill="url(#iris-grad)" />
    <circle cx="27" cy="50" r="2.2" fill="#0F172A" />
    <path d="M14 50 C20 43 34 43 40 50" stroke="#0F172A" stroke-width="2.2" fill="none" />
    <!-- Right Eye -->
    <path d="M60 50 C66 43 80 43 86 50 C80 57 66 57 60 50 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.8" />
    <circle cx="73" cy="50" r="5.2" fill="url(#iris-grad)" />
    <circle cx="73" cy="50" r="2.2" fill="#0F172A" />
    <path d="M60 50 C66 43 80 43 86 50" stroke="#0F172A" stroke-width="2.2" fill="none" />
  
  </g>
</svg>