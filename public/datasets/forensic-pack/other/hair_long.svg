<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="graphite-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="shadow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="iris-grad" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    
  </defs>

  <!-- Clean Evidence Card Background -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5" />
  
  <!-- Feature Artwork -->
  <g class="forensic-feature" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Long Hair: flowing volume framing the jaw and shoulders -->
    <path d="M28 42 C28 26 38 18 50 18 C62 18 72 26 72 42 L72 68 C72 78 62 82 50 82 C38 82 28 78 28 68 Z" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.0" stroke-dasharray="2 2" />
    <!-- Flowing lateral strands -->
    <path d="M24 78 C20 60 22 36 28 26 C34 16 42 14 50 14 C58 14 66 16 72 26 C78 36 80 60 76 78 C70 66 72 48 70 38 C62 34 56 32 50 32 C44 32 38 34 30 38 C28 48 30 66 24 78 Z" fill="#334155" stroke="#0F172A" stroke-width="2.0" />
    <!-- Texture waves -->
    <path d="M25 50 C23 60 26 72 28 78" stroke="#94A3B8" stroke-width="1.4" fill="none" />
    <path d="M75 50 C77 60 74 72 72 78" stroke="#94A3B8" stroke-width="1.4" fill="none" />
  
  </g>
</svg>